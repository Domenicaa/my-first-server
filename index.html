<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Traditions</title>
    <style>
        .card {
            width: 200px;
            height: 250px;
            margin: 1rem auto;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card:hover .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
        }

        .card-front {
            background: white;
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-back {
            background: #8b5cf6;
            color: white;
            transform: rotateY(180deg);
        }
    </style>
</head>

<body>
    <h1>New Year's Traditions</h1>

    <div class="card">
    <div class="card-inner">
        <div class="card-front">
            <img src="images/grapes.jpg" alt="Twelve grapes">
        </div>
        <div class="card-back">
            Eating twelve grapes for each month for good luck
        </div>
    </div>
</div>
    <script>
        // Your javascript code (optional)
    </script>
</body>

</html>
